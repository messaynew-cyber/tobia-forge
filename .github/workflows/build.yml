name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Refresh android scaffolding for this Flutter version
        run: |
          flutter create --platforms=android --org com.tobia --project-name tobia_forge . 2>&1 | tail -2 || true
          git checkout -- lib pubspec.yaml android/app/src/main/kotlin android/app/src/main/AndroidManifest.xml 2>/dev/null || true
          echo "MainActivity present:"; find android/app/src/main/kotlin -name "*.kt" 2>/dev/null

      - name: Enable native assets
        run: flutter config --no-analytics

      - name: Get dependencies
        run: flutter pub get

      - name: Surface Kotlin compile error (diagnostic)
        run: |
          cd android
          ./gradlew :app:compileReleaseKotlin --console=plain 2>&1 | tail -60 || true

      - name: Build APK
        run: flutter build apk --release

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: tobia-forge-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
