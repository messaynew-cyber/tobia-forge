name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Refresh android scaffolding for this Flutter version
        run: |
          flutter create --platforms=android --org com.tobia --project-name tobia_forge . 2>&1 | tail -4
          # Restore OUR app source, pubspec, Kotlin MainActivity + manifest (flutter create overwrote them).
          # Keep the freshly generated android/ gradle + res (correct versions for this Flutter).
          git checkout -- lib pubspec.yaml pubspec.lock android/app/src/main/kotlin android/app/src/main/AndroidManifest.xml 2>/dev/null || true
          echo "--- restored lib ---"; ls lib/ lib/screens/ lib/widgets/ 2>/dev/null
          echo "--- MainActivity present? ---"; find android/app/src/main/kotlin -name "*.kt" 2>/dev/null

      - name: Enable native assets
        run: flutter config --no-analytics

      - name: Get dependencies
        run: flutter pub get

      - name: Analyze (informational)
        run: flutter analyze || true

      - name: Build APK
        run: flutter build apk --release

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: tobia-forge-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
